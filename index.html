
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDER'S — Меню</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Закрепленная панель */
    .category-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
      padding: 12px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .category-list {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .category-list::-webkit-scrollbar {
      display: none;
    }

    /* Прозрачные овальные кнопки */
    .category-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #000000;
      border: 2px solid rgba(230,30,20,0.35);
      border-radius: 50px;
      padding: 10px 17px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 0.25s ease;
    }

    .category-btn:hover,
    .category-btn:focus-visible,
    .category-btn.active {
      border-color: #f02010;
      background: transparent;
    }

    /* Изображения меню */
    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .menu-section {
      position: relative;
      scroll-margin-top: 75px;
    }

    .menu-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Невидимая точка перехода к десертам */
    .dessert-anchor {
      position: absolute;
      top: 64%;
      left: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .category-bar {
        padding: 10px 8px;
      }

      .category-btn {
        font-size: 12px;
        padding: 9px 14px;
      }
    }
  </style>
</head>

<body>

  <!-- Панель категорий -->
  <nav class="category-bar" aria-label="Категории меню">
    <div class="category-list">

      <a href="#sliders" class="category-btn active">
        Пара слайдеров
      </a>

      <a href="#fries" class="category-btn">
        Картофель фри
      </a>

      <a href="#burgers" class="category-btn">
        Бургеры / Смэш
      </a>

      <a href="#combo" class="category-btn">
        Комбо
      </a>

      <a href="#snacks" class="category-btn">
        Снеки
      </a>

      <a href="#salads" class="category-btn">
        Салаты
      </a>

      <a href="#desserts" class="category-btn">
        Десерты
      </a>

      <a href="#drinks" class="category-btn">
        Напитки
      </a>

    </div>
  </nav>

  <!-- Страницы меню -->
  <main class="container">

    <!-- 0. Пара слайдеров -->
    <section id="sliders" class="menu-section">
      <img
        src="Histor_0_1-100.jpg"
        class="menu-image"
        alt="Пара слайдеров">
    </section>

    <!-- 1. Картофель фри -->
    <section id="fries" class="menu-section">
      <img
        src="Histor_1_2-100.jpg"
        class="menu-image"
        alt="Картофель фри">
    </section>

    <!-- 2. Бургеры / Смэш -->
    <section id="burgers" class="menu-section">
      <img
        src="Histor_2-100.jpg"
        class="menu-image"
        alt="Бургеры и смэш">
    </section>

    <!-- 3. Комбо -->
    <section id="combo" class="menu-section">
      <img
        src="Histor_3_1-100.jpg"
        class="menu-image"
        alt="Комбо">
    </section>

    <!-- 4. Снеки -->
    <section id="snacks" class="menu-section">
      <img
        src="Histor_4_2-100.jpg"
        class="menu-image"
        alt="Снеки">
    </section>

    <!-- 5. Салаты и десерты -->
    <section id="salads" class="menu-section">

      <img
        src="Histor_5_1-100.jpg"
        class="menu-image"
        alt="Салаты и десерты">

      <!-- Точка перехода к десертам -->
      <span
        id="desserts"
        class="dessert-anchor"
        aria-hidden="true">
      </span>

    </section>

    <!-- 6. Напитки -->
    <section id="drinks" class="menu-section">
      <img
        src="Histor_6_2-100.jpg"
        class="menu-image"
        alt="Напитки">
    </section>

  </main>

  <script>
    const buttons = [
      ...document.querySelectorAll('.category-btn')
    ];

    const bar = document.querySelector('.category-bar');
    let scrollingToSection = false;
    let scrollTimeout;
    let framePending = false;

    function getTarget(button) {
      const id = button.getAttribute('href').slice(1);
      return document.getElementById(id);
    }

    function getTargetPosition(button) {
      const target = getTarget(button);

      if (!target) return 0;

      return target.getBoundingClientRect().top
        + window.scrollY;
    }

    function activateCategory(index) {
      buttons.forEach((button, i) => {
        const isActive = i === index;
        button.classList.toggle('active', isActive);

        if (isActive) {
          button.setAttribute('aria-current', 'location');
        } else {
          button.removeAttribute('aria-current');
        }
      });

      const activeButton = buttons[index];
      const categoryList = document.querySelector('.category-list');

      // Листаем только горизонтальную панель
      const left = activeButton.offsetLeft
        - categoryList.offsetLeft
        - (categoryList.clientWidth - activeButton.offsetWidth) / 2;

      categoryList.scrollTo({
        left: left,
        behavior: 'smooth'
      });
    }

    // Нажатие на кнопку категории
    buttons.forEach((button, index) => {
      button.addEventListener('click', (event) => {
        event.preventDefault();

        scrollingToSection = true;
        clearTimeout(scrollTimeout);

        activateCategory(index);

        const targetY = getTargetPosition(button)
          - bar.offsetHeight;

        window.scrollTo({
          top: Math.max(0, targetY),
          behavior: 'smooth'
        });

        // Завершаем переход после прокрутки
        scrollTimeout = setTimeout(() => {
          scrollingToSection = false;
          updateOnScroll();
        }, 1100);
      });
    });

    // Автоматическая смена категории
    function updateOnScroll() {
      if (scrollingToSection) return;

      const position = window.scrollY
        + bar.offsetHeight + 15;

      let currentIndex = 0;

      buttons.forEach((button, index) => {
        const targetPosition = getTargetPosition(button);

        if (targetPosition <= position) {
          currentIndex = index;
        }
      });

      const activeIndex = buttons.findIndex(
        button => button.classList.contains('active')
      );

      if (currentIndex !== activeIndex) {
        activateCategory(currentIndex);
      }
    }

    window.addEventListener('scroll', () => {
      if (framePending) return;

      framePending = true;

      requestAnimationFrame(() => {
        updateOnScroll();
        framePending = false;
      });
    }, { passive: true });

    window.addEventListener('resize', updateOnScroll);
    window.addEventListener('load', updateOnScroll);

  </script>

</body>
</html>
