
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDER'S — Меню</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Закреплённая панель */
    .category-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
      padding: 12px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .category-list {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .category-list::-webkit-scrollbar {
      display: none;
    }

    /* Прозрачные овальные кнопки */
    .category-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #000000;
      border: 2px solid rgba(230, 30, 20, 0.35);
      border-radius: 50px;
      padding: 10px 17px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 0.25s ease;
    }

    /* Наведение */
    .category-btn:hover {
      border-color: #f02010;
    }

    /* Активная категория */
    .category-btn.active {
      border-color: #f02010;
      background: transparent;
    }

    /* Основное меню */
    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .menu-section {
      scroll-margin-top: 75px;
    }

    .menu-image {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 480px) {
      .category-bar {
        padding: 10px 8px;
      }

      .category-btn {
        font-size: 12px;
        padding: 9px 14px;
      }
    }
  </style>
</head>

<body>

  <!-- Категории меню -->
  <nav class="category-bar">
    <div class="category-list">

      <a href="#drinks" class="category-btn active">
        Напитки
      </a>

      <a href="#sliders" class="category-btn">
        Пара слайдеров
      </a>

      <a href="#fries" class="category-btn">
        Картофель фри
      </a>

      <a href="#burgers" class="category-btn">
        Бургеры / Смэш
      </a>

      <a href="#combo" class="category-btn">
        Комбо
      </a>

      <a href="#snacks" class="category-btn">
        Снеки
      </a>

      <a href="#salads" class="category-btn">
        Салаты и десерты
      </a>

    </div>
  </nav>

  <!-- Изображения меню -->
  <main class="container">

    <section id="drinks" class="menu-section">
      <img src="Histor_0_1-100.jpg"
           class="menu-image"
           alt="Напитки">
    </section>

    <section id="sliders" class="menu-section">
      <img src="Histor_1_2-100.jpg"
           class="menu-image"
           alt="Пара слайдеров">
    </section>

    <section id="fries" class="menu-section">
      <img src="Histor_2-100.jpg"
           class="menu-image"
           alt="Картофель фри">
    </section>

    <section id="burgers" class="menu-section">
      <img src="Histor_3_1-100.jpg"
           class="menu-image"
           alt="Бургеры и смэш">
    </section>

    <section id="combo" class="menu-section">
      <img src="Histor_4_2-100.jpg"
           class="menu-image"
           alt="Комбо">
    </section>

    <section id="snacks" class="menu-section">
      <img src="Histor_5_1-100.jpg"
           class="menu-image"
           alt="Снеки">
    </section>

    <section id="salads" class="menu-section">
      <img src="Histor_6_2-100.jpg"
           class="menu-image"
           alt="Салаты и десерты">
    </section>

  </main>

  <script>
    const buttons = [...document.querySelectorAll('.category-btn')];
    const sections = [...document.querySelectorAll('.menu-section')];
    const bar = document.querySelector('.category-bar');

    let scrollingToSection = false;
    let scrollTimeout;

    function activateCategory(index) {
      buttons.forEach((button, i) => {
        button.classList.toggle('active', i === index);
      });

      buttons[index].scrollIntoView({
        behavior: 'smooth',
        block: 'nearest',
        inline: 'nearest'
      });
    }

    // Переход по нажатию
    buttons.forEach((button, index) => {
      button.addEventListener('click', (event) => {
        event.preventDefault();

        scrollingToSection = true;
        clearTimeout(scrollTimeout);

        activateCategory(index);

        const target = sections[index];
        const targetY =
          target.getBoundingClientRect().top +
          window.scrollY -
          bar.offsetHeight;

        window.scrollTo({
          top: targetY,
          behavior: 'smooth'
        });

        scrollTimeout = setTimeout(() => {
          scrollingToSection = false;
          updateOnScroll();
        }, 1000);
      });
    });

    // Отслеживание текущего раздела
    function updateOnScroll() {
      if (scrollingToSection) return;

      const offset = bar.offsetHeight + 20;
      let currentIndex = 0;

      sections.forEach((section, index) => {
        if (section.getBoundingClientRect().top <= offset) {
          currentIndex = index;
        }
      });

      const activeIndex = buttons.findIndex(
        button => button.classList.contains('active')
      );

      if (currentIndex !== activeIndex) {
        activateCategory(currentIndex);
      }
    }

    window.addEventListener('scroll', updateOnScroll, {
      passive: true
    });

    window.addEventListener('resize', updateOnScroll);
    window.addEventListener('load', updateOnScroll);
  </script>

</body>
</html>
